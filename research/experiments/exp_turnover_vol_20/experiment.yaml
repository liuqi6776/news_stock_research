experiment: exp_turnover_vol_20
title: 特质换手波动率因子独立验证（最小可复现实验）
factor: turnover_vol_20
direction: neg          # 因子方向: 低换手波动→高收益; 回测按该方向取 Top60
universe: 中证1000 成分股（PIT 指数权重快照）
frequency: 月频截面（每月最后交易日）
forward_return: 未来 20 日收益（T+1~T+20，data_day1 pct_chg 累乘，含复权）
top_n: 60
cost_bps: 20            # 固定双边，非 turnover-based
rebalance: 月末调仓，调仓期收益归属 rb_next
period: 2020-01 ~ 2026-07
data_snapshot: "2026-08-06 运行 (数据含 2026-07-31 调仓日)"
data_drift_note: |
  与生成结论库旧数字(2026-06 快照)相比已漂移: 基准 000852 nav 1.4997->1.2416,
  超额 +28.6%->+50.0%, MaxDD 41.7%->28.8%, ICIR 0.757->0.750。
  根因: 数据滚动(新增 2026-07 调仓月) + index_daily 基准序列被更新。
  结论库 turnover_vol_20.md 数字对应旧快照, 本实验锁定当前快照。
is_oos: none            # 样本内；冻结后独立 OOS 未做（审查 P0-3）
upstream:
  repo: quant_system_v2
  script: research/factor_dic/run_validation.py
  entry: run_fast("turnover_vol_20")
  commit: 9e0fa6b       # 由 run.py 环境锁定期核对
data:
  daily: "D:/iquant_data/data_v2/data_day1 (settings.daily_data_path, 私有)"
  index_weight: research/chip_momentum/data/index_weight（PIT 快照）
  index_daily: research/chip_momentum/data/index_daily（000852.SH 基准）
expected_source: research/factor_dic/results/summary_turnover_vol_20.txt
conclusion_doc: quant_conclusion/STOCK/turnover_vol_20.md
environment:
  python: ">=3.9"
  numpy: ">=1.20"
  pandas: ">=1.3"
  pyarrow: ">=6"
tolerance: {rtol: 0.01}
